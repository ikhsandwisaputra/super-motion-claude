<!doctype html>
<html><head><meta charset="utf-8"><title>sprite sheet</title>
<style>html,body{margin:0;background:#E8641A}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { getSprite } from "./lib/sprites.js";
const c = document.getElementById("c"), ctx = c.getContext("2d");
const g = ctx.createRadialGradient(960, 540, 100, 960, 540, 1100);
g.addColorStop(0, "#E8641A"); g.addColorStop(1, "#7a2606");
ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
ctx.imageSmoothingEnabled = false;
const poses = ["idle", "point", "pointUp", "think", "surprised", "celebrate", "present", "clap", "hold", "fall", "back"];
poses.forEach((p, i) => {
  const s = getSprite("hero", p);
  const sc = 6, x = 20 + (i % 6) * 310, y = 20 + Math.floor(i / 6) * 380;
  ctx.drawImage(s.canvas, x, y, s.w * sc, s.h * sc);
  ctx.fillStyle = "#fff"; ctx.font = "20px monospace"; ctx.fillText(p, x, y + s.h * sc + 18);
});
["normal", "happy", "surprised", "closed"].forEach((e, i) => {
  const s = getSprite("cube", e, 0, 0);
  ctx.drawImage(s.canvas, 1260 + i * 160, 820, s.w * 5, s.h * 5);
});
["qmark", "bang", "bulb", "spark", "clap", "fileSmall"].forEach((p, i) => {
  const s = getSprite("prop", p);
  ctx.drawImage(s.canvas, 40 + i * 120, 1000, s.w * 6, s.h * 6);
});
window.ready = true;
</script></body></html>
