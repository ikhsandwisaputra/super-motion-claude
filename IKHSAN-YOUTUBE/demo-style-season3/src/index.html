<script type="module">
import { makeRenderer, FPS } from './engine.js';
import { makeFilm } from './film.js';
const q = new URLSearchParams(location.search);

    new FontFace('League Gothic', 'url(../fonts/LeagueGothic.ttf)', { stretch: '75% 100%' }),
    new FontFace('Fraunces', 'url(../fonts/Fraunces-Italic.ttf)', { style: 'italic', weight: '100 900' }),

  return true;
})();
